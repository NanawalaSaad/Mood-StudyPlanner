<!DOCTYPE html>
<html>
<head>
    <title>Progress Board</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="navbar">
    <h3>📊 PROGRESS / BOARD</h3>
    <a href="/dashboard">Dashboard</a>
</div>

<div class="center" style="align-items: center; padding-top: 40px; padding-bottom: 40px;">
    <div class="card" style="max-width: 800px; width: 100%;">
        
        <h2 style="color:var(--primary); margin-top:0;">Attendance Tracker</h2>
        <h1 style="font-size: 3rem; color: #a8ff78; margin: 10px 0;">{{ att_count }} <span style="font-size: 1.2rem; color: #aaa;">Days Present</span></h1>
        
        <button onclick="markAtt()" class="btn-neon" style="margin-bottom: 20px; width: auto; padding: 10px 30px;">📷 Mark Attendance</button>
        <p id="attMsg" style="color:var(--secondary); font-weight: bold;"></p>

        <hr style="border-color: rgba(255,255,255,0.1); margin: 30px 0;">

        <h2 style="color:var(--primary);">Study Progress</h2>
        <div style="background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px;">
            <canvas id="chart" height="150"></canvas>
        </div>
        
        <div style="margin-top:20px; display:flex; justify-content:space-between; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
            <span>Student: <b style="color:var(--primary);">{{ session['user'] }}</b></span>
            <span>Total Logged Sessions Analyzed</span>
        </div>

        <div style="margin-top: 30px;">
            <a href="/leaderboard" class="btn-neon" style="text-decoration:none; display: inline-block; padding: 10px 20px; border-radius: 10px;">View Global Leaderboard →</a>
        </div>
    </div>
</div>

<video id="attVideo" autoplay style="display:none;"></video>

<script>
    async function markAtt() {
        document.getElementById('attMsg').innerText = "Scanning face...";
        const video = document.getElementById('attVideo');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            setTimeout(() => {
                video.srcObject.getTracks().forEach(t => t.stop());
                fetch('/mark_attendance', {method: 'POST'}).then(res => res.json()).then(data => {
                    document.getElementById('attMsg').innerText = "Attendance logged! Date & Time: " + new Date().toLocaleString();
                    setTimeout(() => location.reload(), 2000); // Reloads to show updated count
                });
            }, 1500);
        } catch(err) { alert("Camera error"); }
    }

    let subjects = {{ subjects|tojson|default('[]') }};
    let hours = {{ hours|tojson|default('[]') }};
    if(subjects.length > 0) {
        new Chart(document.getElementById("chart"), {
            type: "bar",
            data: { labels: subjects, datasets: [{ label: "Hours Studied", data: hours, backgroundColor: "#00c6ff", borderRadius: 5 }] },
            options: { scales: { y:{ticks:{color:"white"}}, x:{ticks:{color:"white"}} }, plugins:{legend:{labels:{color:"white"}}} }
        });
    } else {
        document.getElementById("chart").outerHTML = "<p style='color:#aaa;'>No data yet. Start your planner!</p>";
    }
</script>
</body>
</html>
