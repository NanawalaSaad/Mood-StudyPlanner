<!DOCTYPE html>
<html>
<head>
    <title>AI Planner | Sign Up</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="center">
    <div class="card">
        <h2 style="margin-top:0;">🚀 CREATE ACCOUNT</h2>
        <form method="POST">
            <input name="username" placeholder="Username" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Signup</button>
        </form>
        <p style="margin-top: 25px;">Already have account? <a href="/" style="color: var(--primary); text-decoration: none;">Login</a></p>
    </div>
</div>
</body>
</html>
